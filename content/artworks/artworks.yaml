- title: Mandeville House Diary Cover
  medium: Coloured pencil and ink
  year: '2018'
  image: mandeville-house-diary-cover.jpg
  note: 'Cover for Mandeville’s house diary at school'
  stages:
    - src: mandeville-house-diary-cover-white.jpg
      alt: The cover artwork finished on a white background, before the teal
      caption: Before the teal background
    - src: mandeville-house-diary-cover-sketch.jpg
      alt: Pencil sketch of the cover layout, with colour swatches around it
      caption: 'Sketch'
    - src: mandeville-house-diary-cover-painting.jpg
      alt: 'Testing colours on the rough at a kitchen table: a hand with a brush over the pencil rough, the printed cover beside it'
      caption: Testing colours on the rough
  alt: 'House diary cover for Mandeville on a teal background: a green dragon over the house name, and three students in green beneath, one with a lacrosse stick'
- title: The Green Dress, a Leaving Gift
  medium: Watercolour and ink
  year: '2019'
  image: green-dress-leaving-gift.jpg
  note: 'Leaving gift for a teacher'
  alt: 'Painting of a dark green dress on a dressmaker’s stand beside a bare tailor’s dummy, on a splashed green background'
- title: The House Dragon, a Leaving Gift
  medium: Ink and watercolour
  year: '2021'
  image: house-dragon-leaving-gift.jpg
  note: 'Commissioned leaving gift for a teacher, with the house dragon and motto'
  stages:
    - src: house-dragon-leaving-gift-line-art.jpg
      alt: Ink line art of the dragon, the globe and the mortarboard before colour
      caption: Line art
    - src: house-dragon-leaving-gift-sketch.jpg
      alt: Pencil sketch of the dragon coiled around a globe inside a drawn frame, with a note where a verse of the house hymn would go
      caption: 'First sketch'
  alt: 'A green and gold dragon coiled around a globe with a mortarboard, with the house motto beneath'
