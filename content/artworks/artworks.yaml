# Personal Work artworks, each with its image in this folder:
#   - title: …
#     medium: …
#     year: …
#     image: file-name.jpg
#     alt: …
#     sold: true      # leave out unless it has been bought. No prices, ever.
#     note: …         # optional: the story, shown in the enlarged view
#     draft: true     # optional: hidden on the live site until removed
#     stages:         # optional, in viewing order: finished → back to the first sketch, then photos of Georgia at work
- title: Mandeville House Diary Cover
  medium: Coloured pencil and ink
  year: '2018'
  image: mandeville-house-diary-cover.jpg
  note: 'Cover for Mandeville’s house diary at school'
  stages:
    - src: mandeville-house-diary-cover-white.jpg
      alt: The cover artwork finished on a white background, before the teal
      caption: Before the teal background
    - src: mandeville-house-diary-cover-sketch.jpg
      alt: Pencil sketch of the cover layout, with colour swatches around it
      caption: 'Sketch'
    - src: mandeville-house-diary-cover-painting.jpg
      alt: 'Testing colours on the rough at a kitchen table: a hand with a brush over the pencil rough, the printed cover beside it'
      caption: Testing colours on the rough
  alt: 'House diary cover for Mandeville on a teal background: a green dragon over the house name, and three students in green beneath, one with a lacrosse stick'
- title: The Green Dress, a Leaving Gift
  medium: Watercolour and ink
  year: '2019'
  image: green-dress-leaving-gift.jpg
  note: 'Leaving gift for a teacher'
  alt: 'Painting of a dark green dress on a dressmaker’s stand beside a bare tailor’s dummy, on a splashed green background'
- title: The House Dragon, a Leaving Gift
  medium: Ink and watercolour
  year: '2021'
  image: house-dragon-leaving-gift.jpg
  note: 'Commissioned leaving gift for a teacher, with the house dragon and motto'
  stages:
    - src: house-dragon-leaving-gift-line-art.jpg
      alt: Ink line art of the dragon, the globe and the mortarboard before colour
      caption: Line art
    - src: house-dragon-leaving-gift-sketch.jpg
      alt: Pencil sketch of the dragon coiled around a globe inside a drawn frame, with a note where a verse of the house hymn would go
      caption: 'First sketch'
  alt: 'A green and gold dragon coiled around a globe with a mortarboard, with the house motto beneath'
- title: Sinbad, House Drama Poster
  medium: Digital
  year: '2019'
  image: sinbad-poster.jpg
  note: 'Poster for my house drama, One Thousand and One Arabian Nights, which I co-wrote and co-directed'
  alt: 'Poster with a red four-poster bed under gold constellations of a ship, a genie and a flying horse, titled Sinbad, with Mandeville’s One Thousand and One Arabian Nights beneath'
- title: Station Triptych
  medium: '[?] Watercolour and ink'
  year: '2020'
  draft: true
  image: station-triptych.jpg
  note: '[?] What it was for'
  alt: 'Three watercolour panels of a station: a long platform in red and teal, a crowd at the ticket barriers under a turquoise sky, and figures against a red wash'
  stages:
    - src: station-triptych-framed.jpg
      alt: The three panels framed together in a grey frame
      caption: Framed
    - src: station-ticket-barriers-colour.jpg
      alt: 'Loose colour sketch of people passing through ticket barriers, washes of teal, orange and red above'
      caption: 'Ticket barriers: colour sketch'
    - src: station-ticket-barriers-ink.jpg
      alt: 'Ink sketch of a crowd at the ticket barriers, the barrier gates in heavy black'
      caption: 'Ticket barriers: ink sketch'
    - src: station-crowd.jpg
      alt: Busy charcoal sketch of a crowd moving through a station concourse
      caption: Crowd sketch
    - src: station-piano.jpg
      alt: 'Ink sketch of people gathered round a public piano on a station concourse'
      caption: Station piano
    - src: station-platform-canopy.jpg
      alt: 'Sketch of a platform under a curved glass canopy, with people waiting and walking'
      caption: Platform canopy
    - src: station-sketchbook-1.jpg
      alt: 'Sketchbook page with handwritten notes beside a charcoal sketch of an underground entrance and passers-by'
      caption: Sketchbook page
    - src: station-sketchbook-2.jpg
      alt: Sketchbook page with a pencil sketch of an empty platform and track, and handwritten notes beneath
      caption: Sketchbook page
- title: Grief
  medium: '[?] Digital painting'
  year: '2022'
  draft: true
  image: grief-green-storm.jpg
  note: '[?] Illustration for a poem about grief: whose poem, and what it was for'
  alt: 'A tiny figure on a dark hillside under a towering green storm, rain streaking down and a faint pyramid of rocks on the ridge'
  stages:
    - src: grief-figure-in-storm.jpg
      alt: 'A figure bent against the wind in a green storm, with a cairn behind on the hill'
      caption: Figure in the storm
    - src: grief-clouds-study.jpg
      alt: Study of swirling green and teal storm clouds
      caption: Cloud study
    - src: grief-lightning.jpg
      alt: 'A small figure on a hillside under a dark blue storm, lightning forking across the sky'
      caption: Lightning version
    - src: grief-breath.jpg
      alt: A figure in profile on dark blue breathing out swirls of green mist
      caption: Breath study
    - src: grief-composition-notes.jpg
      alt: 'Composition sketch of a storm over a hill, with handwritten notes on the triadic composition, scale and perspective'
      caption: Composition notes
    - src: grief-sketchbook.jpg
      alt: 'Sketchbook page titled Grief, with quoted lines from the poem and three ink thumbnails of a figure in a storm'
      caption: Sketchbook thumbnails
